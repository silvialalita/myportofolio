{% extends 'base.html' %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="section-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ first_name }} <span> {{ nick_name }} </span> {{ last_name }}</h1>
                </div>

                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img 
                        class="avatar" 
                        src="/static/img/avatar.png" 
                        alt="Photo of {{ name }}"
                    >
                </div>

                <div class="hero-details">
                    <div class="social-links">
                        <a href="https://github.com/silvialalita" class="social-link">
                            <i class="bxl bx-github"></i>
                        </a>
                        <a href="https://www.linkedin.com/in/sivia-lalita-damayanti-51b9a137a?utm_source=share_via&utm_content=profile&utm_medium=member_android" class="social-link">
                            <i class="bxl bx-linkedin-square"></i>
                        </a>
                        <a href="mailto:silvia.lalita@ui.ac.id" class="social-link">
                            <i class="bxl bx-gmail"></i>
                        </a>
                    </div>

                    <p class="bio">
                        {{ bio }}
                    </p>

                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program  }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Sesi Terakhir Login</dt>
                            <dd>{{ last_login }}</dd>
                        </div>                                        
                    </dl>
                </div>
            </div>
        </section>
